plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.miaiplus'
    compileSdk 37
    compileSdkMinor 0
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'io.github.miaiplus'
        minSdk 33
        targetSdk 35
        versionCode 15
        versionName '1.0.1-preview'
        testInstrumentationRunner 'io.github.miaiplus.DeviceTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Local device builds need optimized Compose code too. Debug remains available
        // for instrumentation, with all of its runtime checks and tooling.
        preview {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    buildFeatures { compose true; buildConfig true }
    lint { abortOnError true }
    testBuildType = providers.gradleProperty("uiTestBuildType").getOrElse("debug")
    if (testBuildType == 'preview' || providers.gradleProperty('settingsUiTests').getOrElse('false').toBoolean()) {
        defaultConfig.testInstrumentationRunner 'io.github.miaiplus.SettingsUiRunner'
        sourceSets.androidTest {
            manifest.srcFile 'src/uiTest/AndroidManifest.xml'
            java.setSrcDirs(['src/uiTest/java'])
        }
    } else {
        sourceSets.androidTest.java.srcDir 'src/uiTest/java'
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.github.libxposed:api:102.0.0'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.jetbrains.compose.ui:ui-test-junit4:1.12.0'
}
